[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sv1"
version = "1.3.1"
description = "XSS, SQL injection, blind XSS and SSRF scanner with Chromium execution proof"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "ee.zvz"},
]
dependencies = [
  "requests==2.34.2",
  "playwright==1.64.1",
]

[project.scripts]
sv1 = "sv1:main"

[tool.setuptools]
py-modules = ["sv1"]

[tool.setuptools.packages.find]
include = ["sv1lib*"]
