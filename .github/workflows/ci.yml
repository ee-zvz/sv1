name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: compile
        run: python -m compileall -q sv1.py sv1lib lab tests

      - name: package metadata
        run: python -m pip install --dry-run --no-deps .

      - name: unit tests
        run: python -m unittest discover -s tests -v

      - name: cli
        run: python sv1.py --version

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy

      - name: coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report -m

  browser-and-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: browser integration
        env:
          SV1_BROWSER_TESTS: "1"
        run: python -m unittest tests.test_browser_1_3 -v

      - name: full lab acceptance
        env:
          SV1_LAB_TESTS: "1"
        run: python -m unittest tests.test_lab_1_3 -v
